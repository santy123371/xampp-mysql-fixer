[package]
name = "xampp_mysql_fixer"
version = "1.0.2"
edition = "2024"
authors = ["santy123371"]
description = "Herramienta nativa para diagnosticar y reparar XAMPP MySQL / MariaDB automáticamente"

[[bin]]
name = "XAMPP_FIXER"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
sysinfo = "0.33"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
